name: Build

on:
  push:
    branches: [ admany_unstable ]
  pull_request:
    branches: [ admany_unstable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find -all jar
        id: find_jar
        run: |
          JAR=$(find build/libs -name '*-all.jar' | head -n 1)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          TS=$(echo "${{ github.event.head_commit.timestamp }}" | tr -d ':' | tr 'T' '-' | tr -d 'Z')
          echo "ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HariChunk
          path: ${{ steps.find_jar.outputs.jar }}

      - name: Publish release (push only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}-${{ steps.find_jar.outputs.ts }}
          name: "[${{ github.ref_name }}] ${{ github.event.head_commit.timestamp }}"
          body: "Automated build from commit ${{ github.sha }}\n\n${{ github.event.head_commit.message }}"
          prerelease: true
          files: ${{ steps.find_jar.outputs.jar }}
