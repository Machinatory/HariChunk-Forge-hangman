buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '6.0.53'
}

apply plugin: 'org.spongepowered.mixin'

base {
    archivesName = "harichunk-harichunk_compat_twilightforest-mc${minecraft_version}-${mod_version}"
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    if (!gradle.startParameter.taskNames.isEmpty()) {
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

mixin {
    add sourceSets.main, "harichunk_compat_twilightforest.refmap.json"
    config "harichunk_compat_twilightforest.mixins.json"
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Twilight Forest"
        url = "https://modmaven.dev/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Module dependencies
    api project(":harichunk_base")
    api project(":harichunk_opts_worldgen_general")

    // Twilight Forest for mixin targets - compile only, not bundled
    compileOnly files("libs/twilightforest-1.20.1-4.3.2508-universal.jar")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version: forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id: "harichunk_compat_twilightforest", mod_name: "HariChunk Compatibility/Twilight Forest", mod_license: mod_license, mod_version: mod_version,
                             mod_authors: mod_authors, mod_description: "Compatibility/Twilight Forest",]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
