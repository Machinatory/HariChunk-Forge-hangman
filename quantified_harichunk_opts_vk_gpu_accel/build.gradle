buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}


base {
    archivesName = "${mod_id}F-quantified-vk-gpu-accel-mc${minecraft_version}-${mod_version}"
}


dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    api project(":harichunk_base")
    api project(":harichunk_quantified")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : "quantified_harichunk_opts_vk_gpu_accel",
                             mod_name            : "HariChunk Quantified Vulkan GPU Acceleration by Admany",
                             mod_license         : "BRSSLA V1.5",
                             mod_version         : mod_version,
                             mod_authors         : "Admany, BlackRift Studios",
                             mod_description     : "BlackRift Studios original HariChunk Vulkan GPU acceleration layer powered by Quantified API. This module owns the VK density/noise acceleration bridge, is not related to C2ME in any way, and C2ME may not copy, modify, reuse, redistribute, or derive from this code. Licensed strictly under BRSSLA V1.5.",]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
